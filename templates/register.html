{% extends "base.html" %}
{% block title %}Register — AssureX Claim Engine{% endblock %}
{% block auth %}
<div class="ax-auth-wrap" style="max-width: 520px;">
  <div class="ax-form-card">
    <h4 style="margin-bottom:16px;">🆕 Create an account</h4>
    <form method="post">
      <div class="ax-field">
        <label>Full name</label>
        <input class="ax-input" type="text" name="name" required>
      </div>
      <div class="ax-field">
        <label>Email</label>
        <input class="ax-input" type="email" name="email" required>
      </div>
      <div class="ax-field">
        <label>Password (min 6 characters)</label>
        <input class="ax-input" type="password" name="password" minlength="6" required>
      </div>
      <div class="ax-field">
        <label>Register as</label>
        <select class="ax-input" name="role">
          <option value="customer">🧑 Customer</option>
          <option value="service_center">🔧 Service center</option>
          <option value="reviewer">🧑‍⚖️ Claim reviewer</option>
        </select>
      </div>
      <button class="ax-btn ax-btn--primary ax-btn--block" type="submit">Create account</button>
    </form>
    <p style="margin-top:16px; font-size:.9rem;">Already registered?
      <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
