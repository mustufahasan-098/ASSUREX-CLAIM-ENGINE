services:
  - type: web
    name: assurex-claim-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: DEMO_NOTIFY_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false